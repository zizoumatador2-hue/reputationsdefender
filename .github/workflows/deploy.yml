name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT: reputationsdefender

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::notice::Starting Cloudflare Pages deployment..."

          # Verify credentials
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing Cloudflare credentials"
            exit 1
          fi

          echo "::notice::Project: $PROJECT"
          echo "::notice::Building deployment manifest..."

          # Create a temporary directory for upload
          UPLOAD_DIR=$(mktemp -d)
          cp -r dist/* "$UPLOAD_DIR/"

          # Get list of files to upload
          FILE_LIST=$(find "$UPLOAD_DIR" -type f -print0 | xargs -0 -I {} bash -c 'echo "{}"' | sort)

          echo "::notice::Files to deploy: $(echo "$FILE_LIST" | wc -l)"

          # Use wrangler to deploy
          echo "::notice::Deploying with Wrangler..."
          npx --yes wrangler@latest pages deploy "$UPLOAD_DIR" \
            --project-name "$PROJECT" \
            --branch main || {
            echo "::error::Wrangler deployment failed"
            exit 1
          }

          echo "::notice::✅ Deployment completed successfully"

      - name: Verify deployment
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Clean token
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r')
          ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\n\r')

          echo "::notice::Verifying deployment..."
          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT" \
            -H "Authorization: Bearer $TOKEN" | python3 -m json.tool || echo "Verification request failed (non-critical)"
