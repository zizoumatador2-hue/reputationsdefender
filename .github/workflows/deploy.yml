name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT: reputationsdefender

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          WRANGLER_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::notice::Starting Cloudflare Pages deployment..."

          if [ -z "$WRANGLER_API_TOKEN" ]; then
            echo "::error::Cloudflare API token is missing"
            exit 1
          fi

          echo "::notice::Project: $PROJECT"
          echo "::notice::Deploying from dist/ directory..."

          npx --yes wrangler@latest pages deploy dist \
            --project-name "$PROJECT" \
            --branch main

      - name: Attach custom domains
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Clean the token
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r')
          ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\n\r')

          for d in reputationsdefender.com www.reputationsdefender.com; do
            echo "Attaching domain: $d"
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/domains" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$d\"}" | python3 -m json.tool
          done

      - name: Configure DNS records
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Clean the token
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r')

          # Get the zone ID for the domain
          zone_response=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=reputationsdefender.com" \
            -H "Authorization: Bearer $TOKEN")

          zone_id=$(echo "$zone_response" | python3 -c 'import sys,json; r=json.load(sys.stdin).get("result",[]); print(r[0]["id"] if r else "")' 2>/dev/null)

          if [ -z "$zone_id" ]; then
            echo "::warning::Could not retrieve zone ID; DNS configuration skipped"
            exit 0
          fi

          echo "::notice::Zone ID: $zone_id"

          # Add CNAME records pointing to Pages
          for name in @ www; do
            record_name=$([ "$name" = "@" ] && echo "reputationsdefender.com" || echo "www.reputationsdefender.com")
            echo "Adding CNAME record for $record_name → $PROJECT.pages.dev"

            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"CNAME\",\"name\":\"$record_name\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" | python3 -m json.tool
          done

      - name: Verify deployment
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Clean the token
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r')
          ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\n\r')

          echo "::notice::Checking deployment status..."
          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT" \
            -H "Authorization: Bearer $TOKEN" | python3 -m json.tool

          echo "::notice::Domain configuration:"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $TOKEN" | python3 -m json.tool
