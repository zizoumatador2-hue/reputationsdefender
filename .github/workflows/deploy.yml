name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT: reputationsdefender

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Parse and validate Cloudflare secrets
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Remove leading/trailing whitespace and any "Bearer " prefix
          t=$(printf '%s' "$RAW_TOKEN" | xargs)
          t=$(echo "$t" | sed -E 's/^[Bb]earer[[:space:]]+//')
          a=$(printf '%s' "$RAW_ACCOUNT" | xargs)

          echo "::add-mask::$t"
          echo "::notice::Cleaned token length: ${#t} chars, Account ID length: ${#a} chars (expected 32)"

          # Use heredoc to safely handle special characters in token
          cat << EOF >> "$GITHUB_ENV"
CLOUDFLARE_API_TOKEN<<HEREDOC
$t
HEREDOC
CLOUDFLARE_ACCOUNT_ID=$a
EOF

      - name: Verify Cloudflare token validity
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare secrets are empty"
            exit 1
          fi

          # Test token with verify endpoint
          response=$(curl -s -w "\n%{http_code}" https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "::notice::Token verify response code: $http_code"
          echo "::notice::Token verify body: $(echo "$body" | head -c 300)"

          if [ "$http_code" != "200" ]; then
            echo "::error::Token verification failed with HTTP $http_code"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Ensure wrangler can find account configuration
          export WRANGLER_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"

          npx --yes wrangler@3 pages deploy dist \
            --project-name="$PROJECT" \
            --branch=main \
            --commit-dirty=true

      - name: Attach custom domains
        continue-on-error: true
        run: |
          for d in reputationsdefender.com www.reputationsdefender.com; do
            echo "Attaching domain: $d"
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$d\"}" | python3 -m json.tool
          done

      - name: Configure DNS records
        continue-on-error: true
        run: |
          # Get the zone ID for the domain
          zone_response=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=reputationsdefender.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          zone_id=$(echo "$zone_response" | python3 -c 'import sys,json; r=json.load(sys.stdin).get("result",[]); print(r[0]["id"] if r else "")' 2>/dev/null)

          if [ -z "$zone_id" ]; then
            echo "::warning::Could not retrieve zone ID; DNS configuration skipped"
            exit 0
          fi

          echo "::notice::Zone ID: $zone_id"

          # Add CNAME records pointing to Pages
          for name in @ www; do
            record_name=$([ "$name" = "@" ] && echo "reputationsdefender.com" || echo "www.reputationsdefender.com")
            echo "Adding CNAME record for $record_name → $PROJECT.pages.dev"

            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"CNAME\",\"name\":\"$record_name\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" | python3 -m json.tool
          done

      - name: Verify deployment
        continue-on-error: true
        run: |
          echo "::notice::Checking deployment status..."
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool

          echo "::notice::Domain configuration:"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool
