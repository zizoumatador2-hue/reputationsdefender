name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT: reputationsdefender

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Clean Cloudflare secrets
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          t=$(printf '%s' "$RAW_TOKEN" | sed -E 's/^[[:space:]]*([Bb]earer[[:space:]]+)?//' | tr -d '[:space:]"')
          a=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]"')
          echo "::add-mask::$t"
          echo "::notice::token length ${#t}, account id length ${#a} (expected 32)"
          echo "CLOUDFLARE_API_TOKEN=$t" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$a" >> "$GITHUB_ENV"

      - name: Check Cloudflare token
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || echo "::error::Secret CLOUDFLARE_API_TOKEN is empty or missing"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is empty or missing"
          v=$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "::notice::token verify: $(echo "$v" | tr -d '\n' | cut -c1-300)"
          p=$(curl -s -g "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "::notice::pages list: $(echo "$p" | tr -d '\n' | cut -c1-300)"

      - name: Create Pages project (first run only)
        run: |
          out=$(npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main 2>&1) || true
          echo "$out"
          echo "::notice::create: $(echo "$out" | tail -8 | tr '\n' ' ' | cut -c1-400)"

      - name: Deploy to Cloudflare Pages
        run: |
          set +e
          out=$(npx --yes wrangler@3 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then echo "::error::deploy: $(echo "$out" | tail -15 | tr '\n' ' ' | cut -c1-600)"; exit 1; fi
          echo "::notice::deploy: $(echo "$out" | tail -4 | tr '\n' ' ')"

      - name: Attach custom domains
        continue-on-error: true
        run: |
          for d in reputationsdefender.com www.reputationsdefender.com; do
            echo "== $d"
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"name\":\"$d\"}"
            echo
          done

      - name: Point DNS at Pages (needs Zone DNS Edit on the token)
        continue-on-error: true
        run: |
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=reputationsdefender.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c 'import sys,json; r=json.load(sys.stdin).get("result") or []; print(r[0]["id"] if r else "")')
          if [ -z "$ZONE" ]; then echo "Token cannot read the zone; skipping DNS"; exit 0; fi
          for name in reputationsdefender.com www; do
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}"
            echo
          done

      - name: Domain status
        continue-on-error: true
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c 'import sys,json; [print(d["name"], d.get("status"), (d.get("verification_data") or {}).get("status")) for d in json.load(sys.stdin).get("result") or []]'
